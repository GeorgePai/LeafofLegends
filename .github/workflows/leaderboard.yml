# 排行榜伺服器自動部署：source 分支的 leaderboard/ 有變動就部署到 Cloudflare（Pai 不用動手）
# 需要 GitHub secret：CLOUDFLARE_API_TOKEN（Workers Scripts 編輯＋D1 編輯）
name: Deploy leaderboard
on:
  push:
    branches: [source]
    paths: ['leaderboard/**', '.github/workflows/leaderboard.yml']
  workflow_dispatch:
concurrency: leaderboard
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leaderboard
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 33fe09f6bdada40ccd22be6e28edd124
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查金鑰
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::還沒設定 CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: 資料表（重複執行安全）
        run: |
          npx -y wrangler@4 d1 execute lol-rank --remote --file=schema.sql -y
          npx -y wrangler@4 d1 execute lol-rank --remote --command "ALTER TABLE players ADD COLUMN hidden INTEGER DEFAULT 0" -y || true
      - name: 部署 Worker
        run: npx -y wrangler@4 deploy
      - name: 上線檢查
        run: sleep 5 && curl -sf https://lol-rank.leafoflegends.workers.dev/board | head -c 300
